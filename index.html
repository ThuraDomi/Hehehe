<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flower Mail Surprise</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="space" id="space"></div>

  <main class="stage">
    <section class="mail-scene" id="mailScene">
      <div class="envelope-wrap" id="envelopeWrap">
        <div class="envelope" id="envelope">
          <div class="back"></div>

          <div class="letter">
            <div class="letter-heart">❤</div>
          </div>

          <div class="flap"></div>
          <div class="front-left"></div>
          <div class="front-right"></div>
          <div class="front-bottom"></div>
        </div>

        <button id="openBtn" class="open-btn">Open Me</button>
      </div>
    </section>

    <section class="surprise-scene" id="surpriseScene">
      <h1 class="surprise-text">Pyin Dl</h1>
    </section>
  </main>

  <div id="flowerLayer" class="flower-layer"></div>

  <script src="script.js"></script>
</body>
</html>
